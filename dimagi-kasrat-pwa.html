<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b18">
<title>दिमागी कसरत — Quiz Game</title>
<style>
:root{--bg:#0d0b18;--card:#18152b;--card2:#211c38;--ink:#f7f3ff;--muted:#aaa1c7;--line:#342d50;--a:#8b5cf6;--b:#06b6d4;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:radial-gradient(circle at 15% 0%,#24134d 0,transparent 35%),radial-gradient(circle at 100% 20%,#083c4b 0,transparent 30%),var(--bg);color:var(--ink);font-family:"Noto Sans Devanagari","Mukta",system-ui,sans-serif}
button,input{font:inherit}button{cursor:pointer}main{max-width:620px;margin:auto;padding:18px 15px 35px}.head{text-align:center;padding:8px 0 18px}.logo{font-size:3rem}.head h1{font-size:1.9rem;background:linear-gradient(90deg,#a78bfa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}.sub{color:var(--muted);font-size:.88rem}
.card{background:rgba(24,21,43,.94);border:1px solid var(--line);border-radius:20px;padding:19px;box-shadow:0 14px 38px #0006;margin-bottom:13px}.welcome{text-align:center}.welcome h2{font-size:1.35rem}.welcome p{color:var(--muted);font-size:.9rem;margin:5px 0 15px}.name{width:100%;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card2);color:var(--ink);outline:none}.name:focus{border-color:var(--a)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{padding:15px 10px;background:var(--card2);border:2px solid var(--line);border-radius:15px;color:var(--ink);text-align:center}.tile:hover{border-color:var(--a);transform:translateY(-2px)}.tile b{display:block}.tile small{color:var(--muted)}.emoji{font-size:1.8rem}.btn{width:100%;padding:13px 17px;border:0;border-radius:13px;background:linear-gradient(90deg,var(--a),var(--b));color:white;font-weight:800;margin-top:10px;box-shadow:0 6px 20px #8b5cf655}.ghost{background:transparent;border:2px solid var(--line);box-shadow:none}.danger{background:#3b1720;border:1px solid #64202d;box-shadow:none}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{padding:6px 10px;border-radius:20px;background:#2a2147;color:#c4b5fd;font-size:.78rem}.progress{height:8px;background:var(--line);border-radius:10px;overflow:hidden;margin:13px 0 20px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));width:0}
.q{font-size:1.2rem;font-weight:800;line-height:1.55;margin-bottom:18px}.opt{display:block;width:100%;text-align:left;padding:13px 15px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;margin:0 0 10px}.opt:hover{border-color:var(--a)}.opt.ok{border-color:var(--ok);background:#0d2b1a;color:#86efac}.opt.bad{border-color:var(--bad);background:#3a1518;color:#fca5a5}.status{min-height:24px;font-weight:700;margin:4px 0}.timer{font-weight:900;color:#22d3ee}.warn{color:#ef4444;animation:pulse .5s infinite}@keyframes pulse{50%{opacity:.45}}
.score{text-align:center;font-size:4.5rem;line-height:1;font-weight:900;background:linear-gradient(90deg,#a78bfa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;margin:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:var(--card2);padding:10px;border-radius:12px}.stat b{display:block;font-size:1.25rem}.stat small{color:var(--muted)}.rank{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid var(--line)}.rank:last-child{border:0}.rank strong{color:#facc15}.section-title{margin-bottom:10px}.footer{text-align:center;color:#746d8b;font-size:.72rem;margin-top:18px}.sound{position:fixed;right:12px;top:12px;width:40px;height:40px;border-radius:50%;background:var(--card);color:white;border:1px solid var(--line);z-index:5}.hidden{display:none!important}@media(max-width:390px){.grid{grid-template-columns:1fr}.q{font-size:1.08rem}}
</style>

function cleanAll(){
 const seen=new Set();
 for(const cat of Object.values(DATA)){cat.qs=cat.qs.filter(x=>{const key=x[0].trim().replace(/\s+/g," ").toLowerCase();if(seen.has(key))return false;seen.add(key);return true})}

/* ===== 100-100 QUESTION ENGINE =====

*/
(function expandQuestionBanks(){
  const add=(cat,arr)=>{
    const seen=new Set(cat.qs.map(x=>String(x[0]).trim().toLowerCase()));
    for(const q of arr){
      const key=String(q[0]).trim().toLowerCase();
      if(!seen.has(key)){cat.qs.push(q);seen.add(key)}
    }
  };

  // 1) गणित — अलग-अलग arithmetic questions
  let m=[];
  for(let n=1;n<=25;n++){
    m.push([`${n} × ${n+2} = ?`,[String(n*(n+2)-2),String(n*(n+2)),String(n*(n+2)+2),String(n*(n+2)+4)],1]);
    m.push([`${n+10} + ${n*2} = ?`,[String(n+10+n*2-1),String(n+10+n*2),String(n+10+n*2+1),String(n+10+n*2+2)],1]);
    m.push([`${n*4} ÷ ${n} = ?`,["2","3","4","5"],2]);
    m.push([`${n*5} - ${n*2} = ?`,[String(n*3-1),String(n*3),String(n*3+1),String(n*3+2)],1]);
  }
  add(DATA.math,m);

  // 2) पैटर्न — स्पष्ट नियम वाले अलग-अलग sequences
  let pat=[];

    pat.push([`अगली संख्या: ${a}, ${b}, ${c}, ${d}, ?`,[String(e-2),String(e),String(e+2),String(e+4)],1]);
  }
  for(let n=2;n<=51;n++){
    const a=n,b=n*2,c=n*3,d=n*4,e=n*5;
    pat.push([`अगली संख्या: ${a}, ${b}, ${c}, ${d}, ?`,[String(e-1),String(e),String(e+1),String(e+2)],1]);
  }
  add(DATA.pattern,pat);

  }
  for(let n=0;n<50;n++){
    const d=days[n%7], next=days[(n+2)%7];
    lg.push([`यदि आज ${d} है, तो 2 दिन बाद कौन-सा दिन होगा?`,[next,days[(n+1)%7],days[(n+3)%7],days[(n+4)%7]],0]);

  add(DATA.logic,lg);

  // 4) सामान्य ज्ञान — 100 बुनियादी तथ्य

function renderBest(){let b=JSON.parse(localStorage.getItem("dk_best")||"{}");let vals=Object.values(b);document.getElementById("mybest").innerHTML=vals.length?vals.map(x=>`<div class="rank"><span>${x.emoji} ${x.name}</span><strong>${x.score}</strong></div>`).join(""):"<div style='color:var(--muted)'>अभी कोई रिकॉर्ड नहीं है।</div>"}
function chooseMode(){
 app.innerHTML=`<div class="head"><div class="logo">🎯</div><h1>गेम मोड चुनें</h1><div class="sub">नमस्ते ${escapeHtml(player)}!</div></div>
 <div class="grid">
 <button class="tile" onclick="daily()"><div class="emoji">📅</div><b>Daily Quiz</b><small>हर दिन का नया चैलेंज</small></button>
 <button class="tile" onclick="categories()"><div class="emoji">🎮</div><b>Normal Quiz</b><small>अपनी कैटेगरी चुनें</small></button>
 </div><button class="btn ghost" onclick="leaderboard()">🏆 Leaderboard</button><button class="btn ghost" onclick="home()">↩️ वापस</button>`;
}
function categories(){
 app.innerHTML=`<div class="head"><div class="logo">🧠</div><h1>कैटेगरी चुनें</h1></div><div class="grid">${Object.entries(DATA).map(([k,v])=>`<button class="tile" onclick="start('${k}')"><div class="emoji">${v.emoji}</div><b>${v.name}</b><small>100 यूनिक सवाल</small></button>`).join("")}</div><button class="btn ghost" onclick="chooseMode()">↩️ वापस</button>`;
}
function daily(){
 let keys=Object.keys(DATA),seed=new Date().toISOString().slice(0,10),n=[...seed].reduce((a,c)=>a+c.charCodeAt(0),0);
 let pool=[];keys.forEach(k=>DATA[k].qs.forEach(q=>pool.push({...q,key:k})));
 pool.sort((a,b)=>hash(a[0]+seed)-hash(b[0]+seed));questions=pool.slice(0,10);catKey="daily";mode="daily";run();
}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return Math.abs(h)}
function start(k){catKey=k;mode="normal";questions=[...DATA[k].qs].sort(()=>Math.random()-.5).slice(0,Math.min(10,DATA[k].qs.length));run()}
function run(){qi=0;score=0;right=0;showQ()}
function showQ(){
 clearInterval(timer);answered=false;time=mode==="daily"?15:15;let q=questions[qi];
 app.innerHTML=`<div class="row"><span class="badge">${catKey==="daily"?"📅 Daily Quiz":DATA[catKey].emoji+" "+DATA[catKey].name}</span><span>${qi+1}/${questions.length}</span></div>
 <div class="row" style="margin-top:8px"><span>⭐ ${score}</span><span id="timer" class="timer">⏱️ ${time}s</span></div>
 <div class="progress"><i style="width:${qi/questions.length*100}%"></i></div>
 <section class="card"><div class="q">${escapeHtml(q[0])}</div><div id="opts">${q[1].map((o,i)=>`<button class="opt" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${escapeHtml(o)}</button>`).join("")}</div><div id="status" class="status"></div><button id="next" class="btn hidden" onclick="next()">अगला सवाल ➜</button></section>`;
 timer=setInterval(()=>{time--;let t=document.getElementById("timer");if(t){t.textContent="⏱️ "+time+"s";if(time<=5)t.classList.add("warn")}if(time<=0){clearInterval(timer);answer(-1)}},1000);
}
function answer(i){
 if(answered)return;answered=true;clearInterval(timer);let q=questions[qi],buttons=[...document.querySelectorAll(".opt")];buttons.forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add("ok")});
 let st=document.getElementById("status");
 if(i===q[2]){right++;score+=10;st.textContent="🎉 सही जवाब！ +10";st.style.color="#22c55e";beep(700)}else{if(i>=0)buttons[i].classList.add("bad");st.textContent=i<0?"⏰ समय समाप्त!":"❌ गलत जवाब";st.style.color="#ef4444";beep(180)}
 document.getElementById("next").classList.remove("hidden");
}
function next(){qi++;if(qi>=questions.length)result();else showQ()}
function result(){
 clearInterval(timer);let pct=Math.round(right/questions.length*100),best=JSON.parse(localStorage.getItem("dk_best")||"{}"),key=catKey;
 let old=best[key]?.score||0,isNew=score>old;best[key]={score:Math.max(score,old),name:player,emoji:key==="daily"?"📅":DATA[key].emoji};localStorage.setItem("dk_best",JSON.stringify(best));
 app.innerHTML=`<div class="head"><div class="logo">${pct>=70?"🏆":"🧠"}</div><h1>क्विज़ पूरा!</h1></div><section class="card">
 <div style="text-align:center;color:var(--muted)">${escapeHtml(player)} का स्कोर</div><div class="score">${score}</div>
 <div style="text-align:center;color:${pct>=70?"#22c55e":"var(--muted)"}">${pct===100?"🏆 Perfect Score!":pct>=70?"🔥 शानदार प्रदर्शन!":pct>=40?"👍 अच्छा प्रयास!":"💪 अभ्यास करते रहें!"}</div>
 ${isNew?`<p style="text-align:center;color:#facc15;margin:10px">🎉 नया High Score!</p>`:""}
 <div class="stats"><div class="stat"><b>${right}</b><small>सही</small></div><div class="stat"><b>${questions.length-right}</b><small>गलत</small></div><div class="stat"><b>${pct}%</b><small>सटीकता</small></div></div>
 <button class="btn" onclick="mode==='daily'?daily():start('${key}')">🔄 फिर से खेलें</button><button class="btn ghost" onclick="categories()">🎮 दूसरी कैटेगरी</button><button class="btn ghost" onclick="leaderboard()">🏆 Leaderboard</button><button class="btn ghost" onclick="share()">📤 Result शेयर करें</button></section>`;
}
function share(){let text=`🧠 दिमागी कसरत में ${player} ने ${score} अंक बनाए! 🎯 सही जवाब: ${right}/${questions.length} — ${Math.round(right/questions.length*100)}%`;if(navigator.share)navigator.share({title:"दिमागी कसरत Result",text});else{navigator.clipboard?.writeText(text);alert("Result कॉपी हो गया।")}}
function leaderboard(){
 let b=JSON.parse(localStorage.getItem("dk_best")||"{}"),arr=Object.values(b).sort((a,b)=>b.score-a.score);
 app.innerHTML=`<div class="head"><div class="logo">🏆</div><h1>Leaderboard</h1><div class="sub">आपके डिवाइस पर बने Best Scores</div></div><section class="card">${arr.length?arr.map((x,i)=>`<div class="rank"><span>${i===0?"🥇":i===1?"🥈":i===2?"🥉":"🏅"} ${escapeHtml(x.name)}<small style="color:var(--muted)"> · ${x.emoji}</small></span><strong>${x.score}</strong></div>`).join(""):"<p style='color:var(--muted)'>अभी कोई स्कोर नहीं। खेलकर पहला रिकॉर्ड बनाइए!</p>"}</section><button class="btn ghost" onclick="chooseMode()">↩️ गेम पर जाएँ</button><button class="btn danger" onclick="resetScores()">🗑️ रिकॉर्ड मिटाएँ</button>`;
}
function resetScores(){if(confirm("क्या आप सभी Best Scores मिटाना चाहते हैं?")){localStorage.removeItem("dk_best");leaderboard()}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
home();
</script>

<script id="pwa-install-script">
(function(){
  let deferredPrompt = null;
  const btn = document.getElementById('installAppBtn');
  if(!btn) return;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    btn.classList.add('show');
  });

  btn.addEventListener('click', async () => {
    if (!deferredPrompt) {
      alert('अगर Install विकल्प नहीं दिख रहा है, Chrome के ⋮ मेनू में जाकर "Add to Home screen" या "Install app" चुनें।');
      return;
    }
    deferredPrompt.prompt();
    const choice = await deferredPrompt.userChoice;
    deferredPrompt = null;
    if (choice && choice.outcome === 'accepted') btn.classList.remove('show');
  });

  window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    btn.classList.remove('show');
  });

  // If already running as an installed PWA, hide the button.
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
    btn.classList.remove('show');
  }
})();
</script>


<script id="pwa-sw-register">
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
